name: Cache (docker)

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true

concurrency:
  group: cache_docker

jobs:
  cache:
    runs-on: ubuntu-22.04
    steps:

    - id: create-tmpfs
      run: |
        echo "CREATE TMPFS"
        mkdir -p /tmp/cache-marker

    - name: Restore cache marker
      id: cache-marker-restore
      uses: actions/cache/restore@v3
      with:
        path: |
          /tmp/cache-marker
        key: ${{ inputs.image_tag }}-marker-v000

    - id: fetch_image
      run: |
        echo ${{ steps.cache-marker-restore.cache-hit }}
        echo "fetching build image: ${{ inputs.image_tag }} for cache!!!"

        echo 1 > /tmp/cache-marker/marker

    - name: Save cache marker
      id: cache-marker-save
      uses: actions/cache/save@v3
      with:
        path: |
          /tmp/cache-marker
        key: ${{ inputs.image_tag }}-marker-v000
