name: Cache (docker)

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
      version:
        type: string
        default: v002

concurrency:
  group: cache_docker

jobs:
  cache:
    runs-on: ubuntu-22.04
    steps:

    - name: Check cache
      id: cache-marker-restore
      uses: actions/cache/restore@v3
      with:
        path: |
          /tmp/build-image-cache
        lookup-only: true
        key: ${{ inputs.image_tag }}-${{ inputs.version }}

    - id: docker-stop
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo systemctl stop docker

    - id: docker-paths
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo mv /var/lib/docker /var/lib/docker.orig

        sudo mkdir /var/lib/docker

        sudo ls -alh /var/lib/docker.orig

    - id: docker-restart
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo systemctl start docker

    - id: docker-fetch
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        docker pull ${{ inputs.image_tag }}

    - id: docker-stop-again
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo systemctl stop docker

    - id: tmp-build-image-cache
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo mount -t tmpfs none /tmp/build-image-cache

    - id: docker-save
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        tar cf - -C /var/lib/docker . | zstd - -T0 -o "/tmp/build-image-cache/docker.tar.zst"

    - name: Save cache marker
      if: ${{ steps.cache-marker-restore.outputs.cache-hit == 'true' }}
      id: cache-marker-save
      uses: actions/cache/save@v3
      with:
        path: |
          /tmp/build-image-cache
        key: ${{ inputs.image_tag }}-${{ inputs.version }}

    - id: tmp-build-image-cache-umount
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo umount /tmp/build-image-cache
