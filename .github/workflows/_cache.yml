name: Cache (docker)

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
      version:
        type: string
        default: v001

concurrency:
  group: cache_docker

jobs:
  cache:
    runs-on: ubuntu-22.04
    steps:

    - id: create-tmpfs
      run: |
        echo "CREATE TMPFS"
        mkdir -p /tmp/cache-marker

    - name: Check cache
      id: cache-marker-restore
      uses: actions/cache/restore@v3
      with:
        path: |
          /tmp/cache-marker
        lookup-only: true
        key: ${{ inputs.image_tag }}-${{ inputs.version }}

    - id: fetch_image
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != true }}
      run: |
        echo "DO SKIP ME!!!"
        echo ${{ steps.cache-marker-restore.outputs.cache-hit }}
        echo "fetching build image: ${{ inputs.image_tag }} for cache!!!"

        echo 1 > /tmp/cache-marker/marker

    - name: Save cache marker
      if: ${{ steps.cache-marker-restore.outputs.cache-hit != true }}
      id: cache-marker-save
      uses: actions/cache/save@v3
      with:
        path: |
          /tmp/cache-marker
        key: ${{ inputs.image_tag }}-${{ inputs.version }}
