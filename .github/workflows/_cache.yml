name: Cache (docker)

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
      version:
        type: string
        default: v004

concurrency:
  # not sure about this
  group: cache_docker-${{ inputs.image_tag }}

jobs:
  cache:
    runs-on: ubuntu-22.04
    steps:

    - name: Check cache
      id: cache-restore
      uses: actions/cache/restore@v3
      with:
        path: |
          /tmp/build-image-cache
        lookup-only: true
        key: ${{ inputs.image_tag }}-${{ inputs.version }}

    - id: tmp-build-image-cache-create
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo mkdir -p /tmp/build-image-cache

    - if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: sudo systemctl stop docker

    - id: docker-paths
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo mv /var/lib/docker /var/lib/docker.orig
        sudo mkdir /var/lib/docker

    - id: docker-restart
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo systemctl start docker

    - id: docker-fetch
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        docker pull ${{ inputs.image_tag }}

    - id: docker-stop-again
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo systemctl stop docker

    - id: tmp-build-image-cache-mount
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo mount -t tmpfs none /tmp/build-image-cache

    - id: docker-save
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        tar cf - -C /var/lib/docker . | sudo zstd - -T0 -o "/tmp/build-image-cache/docker.tar.zst"

        ls -alh /tmp/build-image-cache/docker.tar.zst"

    - name: Save cache
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      id: cache-save
      uses: actions/cache/save@v3
      with:
        path: |
          /tmp/build-image-cache
        key: ${{ inputs.image_tag }}-${{ inputs.version }}

    - id: tmp-build-image-cache-umount
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      run: |
        sudo umount /tmp/build-image-cache
