name: 'Sync downstream'

on:
  push:
    branches:
    - main

# It would be better if there was a concurrency/max/wait option, but
# it seems there is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        ci:
        - go-control-plane
        - envoy-filter-example
        - data-plane-api
    steps:
    - uses: envoyproxy/toolshed/gh-actions/dispatch@7886c0c747844c5169ee27403b10223fed5496c3
      with:
        repository: "phlax/${{ matrix.ci }}"
        ref: main
        key: "${{ secrets.ENVOY_CI_TEST_BOT_KEY }}"
        workflow: envoy-sync.yaml
        app_id: ${{ secrets.ENVOY_CI_SYNC_TEST_APP_ID }}
