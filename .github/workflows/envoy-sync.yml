name: 'Sync downstream'

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-22.04
    # if: github.repository == 'envoyproxy/envoy'
    strategy:
      fail-fast: false
      matrix:
        downstream:
        - go-control-plane
        - envoy-filter-example
        - data-plane-api
    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v3

    # - uses: envoyproxy/toolshed/gh-actions/dispatch@actions-v0.0.2
    - uses: ./.github/actions/dispatch
      with:
        repository: "envoyproxy/${{ matrix.downstream }}"
        ref: main
        key: "${{ secrets.ENVOY_CI_TEST_BOT_KEY }}"
        workflow: envoy-sync.yaml
        app_id: ${{ secrets.ENVOY_CI_SYNC_TEST_APP_ID }}
