name: 'Sync downstream'

on:
  push:
    branches:
    - main

# It would be better if there was a concurrency/max/wait option, but
# it seems there is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    uses: ./.github/workflows/_do_ci.yml
    with:
      ci: sync.${{ matrix.ci }}
      auth_ci_bot_enabled: true
      cache_bazel_enabled: ${{ matrix.cache }}
      repo_fetch_depth: ${{ matrix.repo_fetch_depth }}
      repo_downstream: ${{ matrix.ci }}
      repo_downstream_path: ..
      run_prefix: ${{ matrix.run_prefix }}
      build_setup: ${{ matrix.build_setup }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        ci:
        - data-plane-api
        - go-control-plane
        include:

        - ci: data-plane-api
          build_setup: false
          cache: false
          repo_fetch_depth: 0
          run_prefix: ""

        - ci: go-control-plane
          build_setup: false
          cache: true
          repo_fetch_depth: 1
          run_prefix: "ci/run_envoy_docker.sh"

  sync2:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        ci:
        - envoy-filter-example
    steps:
    - uses: actions/checkout@v3
    - id: dispatch
      uses: envoyproxy/toolshed/gh-actions/dispatch@1f1feae1e372dde41ecc6830028989bb6037c480
      with:
        repository: "phlax/${{ matrix.ci }}"
        ref: main
        key: ${{ secrets.ENVOY_CI_TEST_BOT_KEY }}
        workflow: envoy-sync.yaml
        app_id: ${{ secrets.ENVOY_CI_SYNC_TEST_APP_ID }}
