name: Envoy CI

on:
  workflow_call:
    inputs:
      target:
    # inputs - target

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.workflow }}-ci
  cancel-in-progress: true

jobs:
  repo:
    # if: github.repository == 'envoyproxy/envoy'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Add safe directory
      run: git config --global --add safe.directory /__w/envoy/envoy

    - id: do_ci
      name: 'Run CI target ${{ github.inputs.target }}'
      run: |
        echo "run CI target ..."
      # setup RBE variables, similar to azp/bazel.yml
