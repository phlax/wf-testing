name: 'Sync trigger'

on:
  pull_request_target:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v3
    - uses: envoyproxy/toolshed/gh-actions/dispatch@7886c0c747844c5169ee27403b10223fed5496c3
      # ./.github/actions/dispatch
      with:
        repository: "phlax/wf-testing"
        ref: "${{ github.event.pull_request.head.ref }}"
        key: "${{ secrets.ENVOY_CI_TEST_BOT_KEY }}"
        workflow: envoy-verify.yml
        app_id: ${{ secrets.ENVOY_CI_SYNC_TEST_APP_ID }}
        inputs: |
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sha: ${{ github.event.pull_request.head.sha }}
          head_ref: ${{ github.event.pull_request.head.ref }}
